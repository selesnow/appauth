url: https://alexey-seleznev.pro/appauth/
title: appauth
template:
  bootstrap: 5
  bootswatch: darkly
  theme: arrow-dark
  bslib:
    primary: '#14b8a6'
    secondary: '#38bdf8'
  params:
    bootswatch: darkly
  includes:
    in_header: |
      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z56YHE916N"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-Z56YHE916N');
      </script>
home:
  title: Secure authentication for Shiny
  description: |
    Passwords, sessions, permissions, two-factor authentication and Google sign-in for Shiny applications, with a versioned database schema.
  sidebar:
    structure:
    - links
    - license
    - community
    - citation
    - authors
    - dev
  links:
  - text: Source on GitHub
    href: https://github.com/selesnow/appauth
  - text: Report a bug
    href: https://github.com/selesnow/appauth/issues
navbar:
  structure:
    left:
    - home
    - articles
    - reference
    right: github
  components:
    github:
      icon: fab fa-github
      href: https://github.com/selesnow/appauth
      aria-label: GitHub
